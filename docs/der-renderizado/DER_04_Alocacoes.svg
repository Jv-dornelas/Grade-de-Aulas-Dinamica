1.6836" x="887.222" y="584.0246">0..1</text></g><!--link AlocacaoGrade to Usuario--><g class="link" data-entity-1="AlocacaoGrade" data-entity-2="Usuario" data-source-line="308" data-uid="lnk16" id="link_AlocacaoGrade_Usuario"><path codeLine="308" d="M730.42,587.8673 C749.99,597.6773 763,604.1973 763,604.1973 C763,604.1973 855.91,648.6173 928.67,683.4073" fill="none" id="AlocacaoGrade-Usuario" style="stroke:#365B80;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="86.728" x="786.5" y="589.3911">autorizado_por</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="750.2886" y="616.3251">0..*</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="21.6836" x="887.3665" y="705.9616">0..1</text></g><rect fill="none" height="130.5918" rx="4" ry="4" style="stroke:#CCD6E0;stroke-width:1;" width="742.1416" x="12" y="930.1699"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="468.4941" x="29" y="960.3018">Cada aloca&#231;&#227;o exige exatamente um professor, uma unidade e um hor&#225;rio.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="507.3838" x="29" y="976.4004">Turma, disciplina, demanda e usu&#225;rio autorizador aceitam NULL no modelo atual.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="708.1416" x="29" y="992.499">Essas FKs existem diretamente na aloca&#231;&#227;o, mesmo quando a demanda tamb&#233;m identifica a turma e a disciplina.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="461.1045" x="29" y="1008.5977">Cardinalidades: 1 = exatamente um; 0..1 = opcional; 0..* = zero ou muitos.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="499.5635" x="29" y="1024.6963">PK = chave prim&#225;ria; FK = chave estrangeira; UK = chave &#250;nica; * = NOT NULL.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="491.8389" x="29" y="1040.7949">Blocos cinza mostram apenas a chave de entidades detalhadas em outra vista.</text><!--SRC=[bLRBRY975DttLroHJOAm0-E7HdWo4i-PaHriEJXRTAUxW9AxkpfLrPxOKJucoIBA1sIJBJ-MKzKDj3i16uGGztNgrdtLjTB68lYWEHA4Ro-FsT1GfglV4nboSFhj6HsLN5w8DEA8JOl4pw5O_RdwMnWIn7aahTAI0yZ9Ui1Op2rPHLekbfOYgKLefKg3fSGXeTGXTCozJ3FMd91PSgI-o7H1SuvDLHBBLDZ7J52cuaT7L6IHc7CUsx5AxOGJ-0uNul-N_o2V17LEAyAUrkhBLdHI4QKg4aPaT7fMOMfExntplChCE8gSrvqtLKsLfr6eT2eqlQtmGyJGz9MEX1weM6dwwkJyhF-sNNTgbp0MBlvz3kyN_eXIR-m__zMh7ZGO3Cz7xG3vGNOUgN6ZrLmOetI3aDSD1R3E-6HyHhy4H4sI4NNfqsGw-Z2wfNVlRYxVlmz-tM3SfHB583n2-VyW-uzAivRAbPR7gD07uVHY5NB8ofUmHth6yG4w7OxsO14T7NdXid1XLbCQ5qfDoejhxfHdwq3kqB2vJdY7B98cb1agVAU2I1ZjjqFAkUl09xJHBDjvVfCYjWp9i3STULeiPwwL4QnPB1DfnOnzgtUfVtrzDUfDwBko9OaIPUM3gkb3yyVUxU1Zx_RhD-tsDtNGCgAlmTkgxWD4Pxhi9iZ-gr1h-lkWMGkUSPWdUVmgw9f-3Jh4C48oH5A6U_hfUnTojZd7HPwUYxO5FNLLuWlP_pke6OQRAl80M_8mbABKDgrPeGyR4IPV_OQS5ZF2v3w_hm48jYEfqMcWFQdHFZvkDcgjtTrs72gRNEa6wr6qtywHySQcEdhssw58_OqsfiyLIglI7aX51hj5vx-aNCbMjp8FNZIhPAUx7XCeD3m22CLBrkkqT6iZ90YATuG-AskLUrNc5XaRiCDsa7Z-_r1O1EH2u1TpnVMOe3pP9gK5YjTJaxni7S1ZOFdWj2etRMsyXsvPEnMtD74e90wYoTtL5PvfT6Gaq7o-gHpYo1XKslZIEB-CHOUvpMFjMbhrl4M9C8cYdt8S28ZDqT3-lFehGMMwCfvZ2OBGvy-jEXLlZtquD1O0TBIxeUbI1-FYMJ0ko8KPN9M5s7yuzemc64z2Ar8v9JcM9-F0RYx13fVyW6r7oyHTdozmcmrN68irP26a1lzkor_zayBD2tAma-kf3uy3xEEsoc3TIfyOiNBM2N4cKhVCbROkCRYdzn-4vNZfLZn2x5GE0tf0875Nb49H4Fy2]--></g></svg>