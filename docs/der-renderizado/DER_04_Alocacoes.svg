.2552">1</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="331.4272" y="461.5158">0..*</text></g><!--link Unidade to AlocacaoGrade--><g class="link" data-entity-1="Unidade" data-entity-2="AlocacaoGrade" data-source-line="303" data-uid="lnk11" id="link_Unidade_AlocacaoGrade"><path codeLine="303" d="M179.14,498.1973 C233.09,498.1973 304.89,498.1973 370.91,498.1973" fill="none" id="Unidade-AlocacaoGrade" style="stroke:#365B80;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="72.998" x="239" y="483.3911">local da aula</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="7.23" x="198.9333" y="523.8746">1</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="331.4272" y="523.2133">0..*</text></g><!--link HorarioAula to AlocacaoGrade--><g class="link" data-entity-1="HorarioAula" data-entity-2="AlocacaoGrade" data-source-line="304" data-uid="lnk12" id="link_HorarioAula_AlocacaoGrade"><path codeLine="304" d="M179.14,620.9773 C233.09,603.0873 304.89,579.2873 370.91,557.3973" fill="none" id="HorarioAula-AlocacaoGrade" style="stroke:#365B80;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="86.728" x="232" y="554.3911">hor&#225;rio da aula</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="7.23" x="198.9333" y="644.494">1</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="331.4272" y="584.9108">0..*</text></g><!--link AlocacaoGrade to Turma--><g class="link" data-entity-1="AlocacaoGrade" data-entity-2="Turma" data-source-line="305" data-uid="lnk13" id="link_AlocacaoGrade_Turma"><path codeLine="305" d="M730.42,408.5273 C749.99,398.7173 763,392.1973 763,392.1973 C763,392.1973 855.91,347.4073 928.67,312.3273"