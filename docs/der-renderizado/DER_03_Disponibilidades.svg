ibilidadeHorario" data-entity-2="HorarioAula" data-source-line="225" data-uid="lnk8" id="link_DisponibilidadeHorario_HorarioAula"><path codeLine="225" d="M635.16,529.6973 C665.76,529.6973 698.14,529.6973 726.72,529.6973" fill="none" id="DisponibilidadeHorario-HorarioAula" style="stroke:#365B80;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="655.2695" y="555.0288">0..*</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="7.23" x="699.6213" y="555.4351">1</text></g><rect fill="none" height="130.5918" rx="4" ry="4" style="stroke:#CCD6E0;stroke-width:1;" width="533.5635" x="12" y="680.7891"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="398.4053" x="29" y="710.9209">UNIQUE: DisponibilidadeHorario(professor_id, data, horario_id).</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="437.3701" x="29" y="727.0195">A decis&#227;o por hor&#225;rio tem prioridade sobre a disponibilidade por turno.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="453.6943" x="29" y="743.1182">Disponibilidade n&#227;o possui UNIQUE(professor_id, data) no modelo atual.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="461.1045" x="29" y="759.2168">Cardinalidades: 1 = exatamente um; 0..1 = opcional; 0..* = zero ou muitos.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="499.5635" x="29" y="775.3154">PK = chave prim&#225;ria; FK = chave estrangeira; UK = chave &#250;nica; * = NOT NULL.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="491.8389" x="29" y="791.4141">Blocos cinza mostram apenas a chave de entidades detalhadas em outra vista.</text><!--SRC=[hLLHJzim47xFhpYLbr51HrUAK658RKas12fiey_eIDp6ml55jWE3QJzcs