<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="479px" preserveAspectRatio="none" style="width:927px;height:479px;background:#FFFFFF;" version="1.1" viewBox="0 0 927 479" width="927px" zoomAndPan="magnify"><title>Grade de Aulas Din&#226;mica</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="168.8408" x="372.3516" y="35.1318">Grade de Aulas Din&#226;mica</text><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="299.5166" x="307.0137" y="51.2305">5/5 - Tempo de deslocamento entre unidades</text><!--class Origem--><g class="entity" data-entity="Origem" data-source-line="341" data-uid="ent0002" id="entity_Origem"><rect fill="#F1F3F5" height="106.1973" rx="4" ry="4" style="stroke:#365B80;stroke-width:0.5;" width="180.1924" x="7" y="144.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="150.1924" x="22" y="174.3291">Unidade (papel: origem)</text><line style="stroke:#365B80;stroke-width:0.5;" x1="8" x2="186.1924" y1="194.2959" y2="194.2959"/><ellipse cx="18" cy="219.8452" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="122.9307" x="38" y="223.4277">id : INTEGER &#171;PK&#187;</text><line style="stroke:#365B80;stroke-width:0.5;" x1="8" x2="186.1924" y1="242.3945" y2="242.3945"/></g><!--class MatrizDistancia--><g class="entity" data-entity="MatrizDistancia" data-source-line="344" data-uid="ent0003" id="entity_MatrizDistancia"><rect fill="#EEF5FC" height="226.4932" rx="4" ry="4" style="stroke:#365B80;stroke-width:0.5;" width="250.5303" x="336" y="84.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="95.6895" x="413.4204" y="114.3291">MatrizDistancia</text><line style="stroke:#365B80;stroke-width:0.5;" x1="337" x2="585.5303" y1="134.2959" y2="134.2959"/><ellipse cx="347" cy="159.8452" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="122.9307" x="367" y="163.4277">id : INTEGER &#171;PK&#187;</text><line style="stroke:#365B80;stroke-width:1;" x1="337" x2="585.5303" y1="182.3945" y2="182.3945"/><ellipse cx="347" cy="207.9438" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="172.7236" x="367" y="211.5264">origem_id : INTEGER &#171;FK&#187;</text><ellipse cx="347" cy="248.0425" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="175.0752" x="367" y="251.625">destino_id : INTEGER &#171;FK&#187;</text><ellipse cx="347" cy="288.1411" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="201.5303" x="367" y="291.7236">tempo_minutos : INTEGER &gt;= 0</text></g><!--class Destino--><g class="entity" data-entity="Destino" data-source-line="351" data-uid="ent0004" id="entity_Destino"><rect fill="#F1F3F5" height="106.1973" rx="4" ry="4" style="stroke:#365B80;stroke-width:0.5;" width="182.5439" x="738" y="144.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="152.5439" x="753" y="174.3291">Unidade (papel: destino)</text><line style="stroke:#365B80;stroke-width:0.5;" x1="739" x2="919.5439" y1="194.2959" y2="194.2959"/><ellipse cx="749" cy="219.8452" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="122.9307" x="769" y="223.4277">id : INTEGER &#171;PK&#187;</text><line style="stroke:#365B80;stroke-width:0.5;" x1="739" x2="919.5439" y1="242.3945" y2="242.3945"/></g><!--link Origem to MatrizDistancia--><g class="link" data-entity-1="Origem" data-entity-2="MatrizDistancia" data-source-line="355" data-uid="lnk5" id="link_Origem_MatrizDistancia"><path codeLine="355" d="M187.14,197.1973 C231.9,197.1973 286.86,197.1973 335.74,197.1973" fill="none" id="Origem-MatrizDistancia" style="stroke:#365B80;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="57.0845" x="233" y="182.3911">origem_id</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="7.23" x="207.2295" y="222.8746">1</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="296.7136" y="222.4426">0..*</text></g><!--link MatrizDistancia to Destino--><g class="link" data-entity-1="MatrizDistancia" data-entity-2="Destino" data-source-line="356" data-uid="lnk6" id="link_MatrizDistancia_Destino"><path codeLine="356" d="M587.18,197.1973 C636.58,197.1973 692.33,197.1973 737.78,197.1973" fill="none" id="MatrizDistancia-Destino" style="stroke:#365B80;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="59.2681" x="633" y="182.3911">destino_id</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="19.5127" x="606.3328" y="222.3225">0..*</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="7.23" x="710.9312" y="222.814">1</text></g><rect fill="none" height="130.5918" rx="4" ry="4" style="stroke:#CCD6E0;stroke-width:1;" width="629.3213" x="12" y="328.6904"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="545.5557" x="29" y="358.8223">Origem e destino s&#227;o pap&#233;is da mesma tabela Unidade, n&#227;o s&#227;o duas tabelas distintas.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="595.3213" x="29" y="374.9209">Cada registro exige uma origem e um destino; cada unidade pode aparecer em v&#225;rios registros.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="490.2529" x="29" y="391.0195">O tempo &#233; direcional. N&#227;o h&#225; UNIQUE(origem_id, destino_id) no modelo atual.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="461.1045" x="29" y="407.1182">Cardinalidades: 1 = exatamente um; 0..1 = opcional; 0..* = zero ou muitos.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="499.5635" x="29" y="423.2168">PK = chave prim&#225;ria; FK = chave estrangeira; UK = chave &#250;nica; * = NOT NULL.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="491.8389" x="29" y="439.3154">Blocos cinza mostram apenas a chave de entidades detalhadas em outra vista.</text><!--SRC=[ZLJRJjj047ttLup22o18aq8GIW29t1221jgIPpJOcsJ5UjTQhw6awiVGFl4BVSsFzQpj42kKgb5asJDdpioSsHqddHB1cUL84FwdcUAK-b8lViOovA3reKMxT2FYn52EI9K9EHRQ6SB32igqZ12S1a97v78s9IQE0B1oEdCKIIj29uqEPX8KeRGXCEczr0bRZYcTSMGUfPxIX5LQzIYfXNjA12L6FVcFYYyI4ywK6nhjHgY7JgrazNV_LpaNrDolE4-jDOyhrrx5fGrw4Gdjjof6o_hU6m-gneIZo5VT_5X5can7eR5QM3gis4F8cdQDZOJj6MKiRUmTjBg7ZVMYtdCgCOM-NGxlftcA4ZVCVsznrKIzNlzWq0Wm7qpdYMhZOc2qcN0YL9iCnYJYhHfXy5VvEtYRmxrXYxu7HDia8shJ-UXcS3RuGaT7rnSd9y6FLxfFxAoSzsNgM8UISver6sqC1iFMiFSFFgBTtTnPL7ExXXaMc6r_09tKvbs_yoVrDfOwSoQjG4wEgL4fUbs3ahOGeLzy_9SAGQbOhLb31rHhrElRjJVzjrTj1Uk-CiG7WsEPkrtfD0YAgTATSSxu6KySIYepYoMIqiKlWrEPB5vaIX5JBDAOoV6TK4nbnpkaFIg7HXcQBTp0Iq_YEAs3kiS8js8AcyKz_uP4b87BB5DcyJ9hXq8FBhS0RYeUZBCeGjm0O1yMprPY54ksdF-gc1CjNehjWEN0gauZNzLiyKpZqVddyM3pLRITYXfRkA8K8uqon2v3N5wmnLraLQoYDZNf66MpopULBxT3aDbRJL9aomtRCCm5MZGPnPbqHNNN5p27Ctv0ErR6lW7kq71bHItO25CXBUpZbNtnMsDdTiZJZgvkQ3I-lFI4NUnCI11AFSTKZ8-E8PBGq9tBMCZc3sTUFpuS