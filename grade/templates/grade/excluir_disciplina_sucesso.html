{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disciplina Excluída - Cursinho Chico Mendes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .topbar {
            background: #0f172a;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 4px;
        }

        .container {
            max-width: 650px;
            margin: 70px auto;
            padding: 0 25px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 40px 35px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            text-align: center;
        }

        .icone {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #dcfce7;
            color: #16a34a;

            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        .mensagem {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .nome-disciplina {
            display: inline-block;

            padding: 10px 16px;
            margin-bottom: 28px;

            background: #f1f5f9;
            border-radius: 8px;

            font-weight: bold;
            color: #0f172a;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .botao {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 12px 22px;

            border-radius: 8px;

            text-decoration: none;
            font-weight: bold;

            background: #1e40af;
            color: white;
        }

        .botao:hover {
            background: #1d4ed8;
        }

        .secundario {
            background: #e2e8f0;
            color: #475569;
        }

        .secundario:hover {
            background: #cbd5e1;
        }
    </style>
<link rel="stylesheet" href="{% static 'grade/navegacao.css' %}?v=20261110-3">
<link rel="stylesheet" href="{% static 'grade/formularios.css' %}?v=20261111">
</head>

<body class="pagina-cadastro">

    {% include 'grade/navegacao_principal.html' %}

    <main class="container">

        <div class="card">

            <div class="icone">
                ✓
            </div>

            <h1>Disciplina excluída</h1>

            <p class="mensagem">
                A disciplina abaixo foi excluída com sucesso:
            </p>

            <div class="nome-disciplina">
                {{ nome_disciplina }}
            </div>

            <div class="botoes">

                <a
                    href="{% url 'grade:lista_disciplinas' %}"
                    class="botao"
                >
                    Ver disciplinas
                </a>

                <a
                    href="{% url 'grade:excluir_disciplina' %}"
                    class="botao secundario"
                >
                    Excluir outra
                </a>

            </div>

        </div>

    </main>

</body>
</html>
