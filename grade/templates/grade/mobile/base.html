{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164e47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block title %}Minha Grade{% endblock %}</title>
  <link rel="manifest" href="{% url 'grade:mobile_manifest' %}">
  <link rel="apple-touch-icon" href="{% static 'grade/mobile/icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'grade/mobile/mobile.css' %}">
  <script src="{% static 'grade/mobile/mobile.js' %}" defer></script>
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <header class="topbar"><a class="brand" href="{% url 'grade:mobile' %}"><span class="brand-icon" aria-hidden="true">▦</span> Minha Grade</a>
    {% if user.is_authenticated %}<form action="{% url 'grade:mobile_logout' %}" method="post">{% csrf_token %}<button class="logout" type="submit">Sair</button></form>{% endif %}
  </header>
  <main id="conteudo">{% block content %}{% endblock %}</main>
  <footer class="app-footer">Sua semana de aulas, sempre à mão.</footer>
</body>
</html>
