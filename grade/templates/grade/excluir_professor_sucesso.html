<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Professor excluído | Grade CCM</title>

    <style>
        :root {
            --navy: #0F172A;
            --blue: #1E40AF;
            --surface: #F8FAFC;
            --border: #E2E8F0;
            --text: #0F172A;
            --muted: #64748B;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--surface);

            color: var(--text);
        }

        .topbar {
            height: 72px;

            background: var(--navy);

            display: flex;

            align-items: center;

            padding: 0 36px;
        }

        .brand {
            color: white;

            font-size: 22px;

            font-weight: 800;

            text-decoration: none;
        }

        .brand span {
            color: #38BDF8;
        }

        .container {
            max-width: 700px;

            margin: 0 auto;

            padding: 80px 32px;
        }

        .card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(15, 23, 42, 0.06);
        }

        .icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #ECFDF5;

            color: var(--success);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 30px;

            font-weight: 800;
        }

        h1 {
            font-size: 26px;

            margin-bottom: 12px;
        }

        p {
            color: var(--muted);

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            height: 44px;

            padding: 0 22px;

            border-radius: 8px;

            background: var(--blue);

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;
        }

        .button:hover {
            background: #1D4ED8;
        }
    </style>
</head>

<body>

<header class="topbar">

    <a href="/" class="brand">
        Grade <span>CCM</span>
    </a>

</header>


<main class="container">

    <section class="card">

        <div class="icon">
            ✓
        </div>


        <h1>
            Professor excluído com sucesso!
        </h1>


        <p>
            O professor
            <strong>{{ nome_professor }}</strong>
            foi removido do sistema.
        </p>


        <a
            href="/professores/"
            class="button"
        >
            Voltar para professores
        </a>

    </section>

</main>

</body>
</html>
